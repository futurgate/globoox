    prompt: |
      Use case: precise-object-edit.
      This image is a production botanical asset whose BACKGROUND is defective: the gray-white checkerboard has been baked into RGB pixels. Correct the background, not the botanical composition.
      Replace EVERY checkerboard tile and every empty gap between needles and cone scales with ONE FLAT SOLID PURE WHITE RGB255,255,255 background. The white must be uniform and opaque. Do NOT make transparency, do NOT draw a checkerboard, do NOT add shadows or any paper grain/background gradients. Remove the small stray gray sliver at the extreme top-left corner.
      Preserve the exact conifer twig, both cones, muted olive needle color, warm gray-brown scales, fine pencil and watercolor detail, positions, orientation and overall silhouette. Keep every needle tip and both cone tips complete. Add quiet8% white breathing room around the overall botanical silhouette if needed; no plant part should touch any image edge. Square canvas, ideally1024x1024.
      Return one clean white-background botanical PNG only. No text, extra object, UI or frame. The existing botanical artwork is the asset to preserve faithfully.
