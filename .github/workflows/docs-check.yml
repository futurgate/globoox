name: Documentation check

on:
  pull_request:
    paths:
      - README.md
      - CLAUDE.md
      - docs/**
      - scripts/check-docs.mjs
      - package.json
      - .github/workflows/docs-check.yml
  push:
    branches:
      - main
    paths:
      - README.md
      - CLAUDE.md
      - docs/**
      - scripts/check-docs.mjs
      - package.json
      - .github/workflows/docs-check.yml

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/check-docs.mjs
